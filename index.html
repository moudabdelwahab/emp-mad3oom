<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمد شعبان</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Cairo", sans-serif;
}

body{
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:350px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    animation:fadeIn 1.5s;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#fff;
    color:#2c5364;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:50px;
    margin:auto;
    margin-bottom:20px;
    font-weight:bold;
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

p{
    opacity:.9;
    line-height:1.8;
    margin-bottom:20px;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#00c6ff;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0072ff;
    transform:scale(1.05);
}

#message{
    margin-top:20px;
    font-size:18px;
    color:#FFD700;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">
    <div class="avatar">م</div>

    <h1>محمد شعبان</h1>

    <p>
        مرحبًا بك في صفحتي الشخصية.<br>
        أنا محمد شعبان، أهتم بتطوير الويب والبرمجة
        وتصميم المواقع الحديثة.
    </p>

    <button onclick="showMessage()">اضغط هنا</button>

    <div id="message"></div>
</div>

<script>
function showMessage(){
    const messages = [
        "أهلاً وسهلاً بك ❤️",
        "تشرفت بزيارتك للموقع 🌹",
        "أتمنى لك يوماً سعيداً ☀️",
        "شكراً لمرورك 🙏"
    ];

    const random = Math.floor(Math.random() * messages.length);
    document.getElementById("message").innerHTML = messages[random];
}
</script>

</body>
</html>

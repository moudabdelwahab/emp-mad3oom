<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>عمليات الموظفين — مدعوم</title>

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('eo.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>

</head>
<body>
<div class="auth-page">
  <div class="auth-card center">
    <div class="auth-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 3 6.5v5c0 5 3.8 9.2 9 10.5 5.2-1.3 9-5.5 9-10.5v-5L12 2Z"/><path d="M12 8v4l2.5 1.6"/>
        </svg>
      </div>
      <div>
        <h2>عمليات الموظفين</h2>
        <div class="small muted">منصة مدعوم</div>
      </div>
    </div>
    <p class="muted small">جارٍ التحقق من الجلسة…</p>
  </div>
</div>
<script type="module">
  import { sb } from './js/services/client.js';
  const { data } = await sb.auth.getSession();
  location.replace(data.session ? 'dashboard.html' : 'login.html');
</script>
</body>
</html>
